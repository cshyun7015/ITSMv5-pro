spring:
  datasource:
    # Point to the persistent itsm-test-db service on port 3307
    url: jdbc:mariadb://localhost:3307/system_mgmt
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: itsmpass
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: true

logging:
  level:
    com.itsm.system: DEBUG
    org.hibernate.SQL: DEBUG
