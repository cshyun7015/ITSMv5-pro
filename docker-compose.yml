services:
  # Database
  itsm-db:
    image: mariadb:10.11
    container_name: itsm-db
    environment:
      - MARIADB_ROOT_PASSWORD=itsmpass
      - MARIADB_DATABASE=itsm_common
      - TZ=Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - itsm-db-data:/var/lib/mysql
      - ./infra/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  # API Gateway: OTel 모듈이 포함된 Nginx 이미지 사용 권장
  api-gateway:
    image: nginxinc/nginx-unprivileged:otel # 실제 운영시에는 OTel 모듈이 포함된 커스텀 이미지나 nginxinc/nginx-unprivileged:otel 권장
    container_name: api-gateway
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Asia/Seoul
    depends_on:
      itsm-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - itsm-network

  # Frontend
  portal-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal-ui
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - TZ=Asia/Seoul
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - itsm-network

  # Backend Services (Common Configuration 적용)
  request-service: &backend-template
    build:
      context: ./backend-request
      dockerfile: Dockerfile
    container_name: request-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://itsm-db:3306/request_mgmt
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=itsmpass
      - TZ=Asia/Seoul
      # OTel 설정 추가
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=request-service
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none # 트레이싱에 집중하기 위해 메트릭은 일단 제외
    depends_on:
      itsm-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - itsm-network

  system-service:
    <<: *backend-template
    build:
      context: ./backend-system
    container_name: system-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://itsm-db:3306/system_mgmt
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=itsmpass
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_SERVICE_NAME=system-service

  dashboard-service:
    <<: *backend-template
    build:
      context: ./backend-dashboard
    container_name: dashboard-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://itsm-db:3306/system_mgmt
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=itsmpass
      - SYSTEM_SERVICE_URL=http://system-service:8080
      - REQUEST_SERVICE_URL=http://request-service:8080
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_SERVICE_NAME=dashboard-service

  event-service:
    <<: *backend-template
    build:
      context: ./backend-event
    container_name: event-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://itsm-db:3306/event_mgmt
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=itsmpass
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=none
      - OTEL_SERVICE_NAME=event-service

  # --- Observability Stack ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - itsm-network

  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo.yaml
      # 데이터를 저장할 빈 폴더를 연결 (권한 문제 방지)
      - ./infra/tempo/data:/var/tempo
    networks:
      - itsm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/console_templates"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - itsm-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - TZ=Asia/Seoul
    ports:
      - "3001:3000"
    volumes:
      # 1. 데이터 소스 자동 로드 설정 (프로비저닝)
      - ./infra/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      # 2. 대시보드, 유저 설정 등 전체 데이터 영구 저장 (볼륨)
      - grafana-storage:/var/lib/grafana
    depends_on:
      - tempo
      - prometheus
    networks:
      - itsm-network

  # E2E Test: Dedicated Playwright container
  itsm-test-e2e:
    build:
      context: ./e2e
      dockerfile: Dockerfile.e2e
    container_name: itsm-test-e2e
    environment:
      - BASE_URL=http://portal-ui:80
      - DB_HOST=itsm-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=itsmpass
      - TZ=Asia/Seoul
    depends_on:
      portal-ui:
        condition: service_started
      itsm-db:
        condition: service_healthy
    networks:
      - itsm-network
    volumes:
      - ./e2e/specs:/app/specs
      - ./e2e/pages:/app/pages
      - ./e2e/utils:/app/utils
      - ./e2e/fixtures:/app/fixtures
      - ./e2e/playwright.config.ts:/app/playwright.config.ts
      - ./e2e/playwright-report:/app/playwright-report
      - ./e2e/test-results:/app/test-results
    # Use 'docker-compose run itsm-test-e2e' to execute tests manually

networks:
  itsm-network:
    driver: bridge

volumes:
  itsm-db-data:
  grafana-storage: