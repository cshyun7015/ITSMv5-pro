server:
  port: 8083

spring:
  application:
    name: backend-incident
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/itsm_incident?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:itsm1234}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.itsm.incident: DEBUG
  pattern:
    console: "{\"@timestamp\":\"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}\",\"service\":\"${spring.application.name}\",\"level\":\"%level\",\"trace_id\":\"%X{traceId:-}\",\"span_id\":\"%X{spanId:-}\",\"thread\":\"%thread\",\"logger\":\"%logger\",\"message\":\"%msg\",\"stack_trace\":\"%ex\"}%n"
