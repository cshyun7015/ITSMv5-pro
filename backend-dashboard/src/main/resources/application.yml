spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Aggregator doesn't manage schema
    show-sql: false

logging:
  level:
    org.springframework.security: DEBUG
    com.itsm.dashboard: TRACE
    com.itsm.dashboard.security: TRACE
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET:ITSMLongSecretKeyForSecurityPurposes1234567890!}
  expiration: 86400000

services:
  system-url: ${SYSTEM_SERVICE_URL:http://system-service:8080}
  request-url: ${REQUEST_SERVICE_URL:http://request-service:8080}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name:itsm-dashboard}
