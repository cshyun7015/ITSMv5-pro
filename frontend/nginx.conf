load_module /usr/lib/nginx/modules/ngx_otel_module.so;

pid /tmp/nginx.pid; # 권한 에러 방지

worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    
    otel_exporter { endpoint otel-collector:4317; }
    otel_service_name portal-ui;

    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Buffer fixes for large JWT cookies
    large_client_header_buffers 4 32k;
    client_body_buffer_size 128k;
    
    # JSON Log Format
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    server {
        listen       80;
        server_name  localhost;

        # [추가] 트레이싱 활성화
        otel_trace on;
        # [추가] 브라우저(RUM)에서 보낸 Trace ID를 다음 단계로 전달
        otel_trace_context propagate;

        # Resolver for Docker internal DNS
        resolver 127.0.0.11 valid=30s;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to the API Gateway
        location /api/v1 {
            # Standard Proxy Headers
            set $upstream_gateway api-gateway;
            proxy_pass http://$upstream_gateway:80;

            # [추가] 업스트림으로 트레이스 컨텍스트 전파
            otel_trace on;
            otel_trace_context propagate;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Critical: Pass all request headers including Cookies
            proxy_pass_request_headers on;
            
            # Extra Buffers for large JWT Cookies
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # Nginx Status for Prometheus Exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
        }
    }
}
