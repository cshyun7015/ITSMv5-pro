server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: itsm-tenant
    batchwait: 1s       # 로그를 모아서 보낼 최대 대기 시간
    batchsize: 1048576  # 최대 1MB 단위로 묶어서 전송 (M4 성능 최적화)
    backoff_config:     # 전송 실패 시 재시도 전략
      min_period: 100ms
      max_period: 10s
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    
    pipeline_stages:
      - docker: {}
      
      # 1. itsm-db 로그를 JSON으로 변환 (텍스트 -> JSON)
      - match:
          selector: '{service="itsm-db"}'
          stages:
            - regex:
                expression: "^(?P<db_time>\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2})\\s+(?P<db_thread>\\d+)\\s+\\[(?P<db_level>\\w+)\\]\\s+(?P<db_msg>.*)$"
            - template:
                source: json_msg
                template: '{"time":"{{.db_time}}", "service":"itsm-db", "level":"{{.db_level}}", "thread":"{{.db_thread}}", "message":"{{.db_msg}}"}'
            - output:
                source: json_msg

      # 2. JSON 형식이 아니더라도 폐기하지 않고 수집 (디버깅을 위해 모든 로그 허용)
      # - drop:
      #     expression: "^[^{]"

      # 3. JSON Parsing (Primary for modern logs)
      - json:
          expressions:
            level: level
            status: status
            method: request_method
            uri: request_uri
            message: message
            trace_id: trace_id
            span_id: span_id

      # 2. Level Normalization & Extraction (Fallback for Regex)
      - labels:
          level:
      - match:
          selector: '{level=""}'
          stages:
            - regex:
                expression: '.*\[(?P<extracted_level>(?i)Warning|ERROR|Note|Info)\].*'
            - labels:
                level: extracted_level
            - template:
                source: level
                template: '{{ if eq .Value "Warning" }}WARN{{ else if eq .Value "Note" }}INFO{{ else if eq .Value "Info" }}INFO{{ else }}{{ .Value }}{{ end }}'
            - labels:
                level:

      # 3. HTTP status labeling for Nginx (if parsed via JSON)
      - labels:
          status:
          method:

      # 4. Filter itsm-db logs (Drop INFO and below)
      - match:
          selector: '{service="itsm-db"}'
          stages:
            - regex:
                expression: '.*\[(?P<db_level>\w+)\].*'
            - labels:
                db_level:
            - match:
                selector: '{db_level="Note"}'
                action: drop

      # 5. Fallback for unlabeled INFO
      - match:
          selector: '{level=""}'
          stages:
            - static_labels:
                level: INFO
