# 1. OpenTelemetry 모듈 로드 (최상단에 위치해야 함)
load_module /usr/lib/nginx/modules/ngx_otel_module.so;

# 권한 문제를 피하기 위해 PID 파일 위치를 /tmp로 변경
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 2. OpenTelemetry 글로벌 설정
    otel_exporter {
        endpoint otel-collector:4317; # Collector의 gRPC 포트로 전송
    }
    otel_service_name api-gateway; # Grafana에 표시될 서비스 이름

    # Logs for debugging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Enable Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Buffer fixes for large JWT cookies
    large_client_header_buffers 4 32k;
    client_body_buffer_size 128k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # API Gateway Configuration
    server {
        listen 80;
        server_name localhost;

        # 3. 트레이싱 활성화 및 컨텍스트 전파(Propagation) 설정
        otel_trace on;
        otel_trace_context propagate;

        # Resolver for Docker internal DNS
        resolver 127.0.0.11 valid=30s;

        # Portal/UI Static Files
        location / {
            set $upstream_portal portal-ui;
            proxy_pass http://$upstream_portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Request Management API
        location /api/v1/request {
            set $upstream_request request-service;
            proxy_pass http://$upstream_request:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Auth & System Administration API
        location /api/v1/auth {
            set $upstream_system system-service;
            proxy_pass http://$upstream_system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/v1/system {
            set $upstream_system system-service;
            proxy_pass http://$upstream_system:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/v1/dashboard {
            set $upstream_dashboard dashboard-service;
            proxy_pass http://$upstream_dashboard:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;
        }

        # Event Management API
        location /api/v1/event {
            set $upstream_event event-service;
            proxy_pass http://$upstream_event:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Health Check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Nginx Status for Prometheus Exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
        }
    }
}