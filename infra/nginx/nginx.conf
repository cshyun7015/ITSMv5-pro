events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logs for debugging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Enable Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Buffer fixes for large JWT cookies
    large_client_header_buffers 4 32k;
    client_body_buffer_size 128k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # API Gateway Configuration
    server {
        listen 80;
        server_name localhost;

        # Resolver for Docker internal DNS
        resolver 127.0.0.11 valid=30s;

        # Portal/UI Static Files
        location / {
            set $upstream_portal portal-ui;
            proxy_pass http://$upstream_portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Request Management API
        location /api/v1/request {
            proxy_pass http://request-service:8080/api/v1/request;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Auth & System Administration API (Both go to system-service)
        location /api/v1/auth {
            proxy_pass http://system-service:8080/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/v1/system {
            proxy_pass http://system-service:8080/api/v1/system;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/v1/dashboard {
            proxy_pass http://dashboard-service:8080/api/v1/dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        # Health Check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
